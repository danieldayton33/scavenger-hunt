version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: scavenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: scavenger_hunt
      TZ: 'America/New_York'
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appuser -d scavenger_hunt']
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: pgAdmin UI
  pgadmin:
    image: dpage/pgadmin4
    container_name: scavenger-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - '8080:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
